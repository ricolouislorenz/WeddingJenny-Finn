<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jenny &amp; Finn · Willkommen</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f4f2ea" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/roboto-condensed-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/augustromascript.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Eigenständige Anmeldeseite – bewusst ohne App-Bundle, damit vor dem Login nichts geladen wird */
      @font-face {
        font-family: 'August Roma Script';
        src: url('/fonts/augustromascript.woff2') format('woff2'), url('/fonts/augustromascript.otf') format('opentype');
        font-display: swap;
      }
      @font-face {
        font-family: 'Roboto Condensed Variable';
        src: url('/fonts/roboto-condensed-latin.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        --ink: #455b46;
        --sage: #889e83;
        --moss: #8ca078;
        --stone: #a0a08c;
        --fern: #a0b48c;
        --bg: #f4f2ea;
        --paper: #fcfbf7;
        --tint: #eef0e6;
        --line: #d9ddcd;
        --gold: #b8965a;
        --error: #9b3d2e;
        --script: 'August Roma Script', 'Snell Roundhand', 'Brush Script MT', Georgia, serif;
        --sans: 'Roboto Condensed Variable', 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;

        color-scheme: light;
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink);
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse 70% 50% at 50% 30%, #fbfaf4, transparent 70%),
          var(--bg);
      }

      main {
        width: min(100%, 400px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: var(--script);
        font-weight: 400;
        font-size: clamp(2.6rem, 12vw, 3.4rem);
        line-height: 1.05;
      }

      h1 span {
        color: var(--moss);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 0.72rem;
        letter-spacing: 0.36em;
        padding-left: 0.36em;
        text-transform: uppercase;
      }

      .intro {
        margin: 8px 0 0;
        max-width: 32ch;
        font-weight: 300;
      }

      form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .field {
        position: relative;
      }

      input {
        width: 100%;
        font: inherit;
        font-size: 1rem; /* verhindert Auto-Zoom auf iOS */
        color: var(--ink);
        text-align: center;
        letter-spacing: 0.06em;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 48px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--moss);
        box-shadow: 0 0 0 3px rgb(140 160 120 / 0.22);
      }

      .toggle {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }

      .toggle:hover {
        background: var(--tint);
      }

      .toggle svg {
        width: 20px;
        height: 20px;
      }

      button[type='submit'] {
        min-height: 50px;
        border: 0;
        border-radius: 12px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 0.2s;
        touch-action: manipulation;
      }

      button[type='submit']:hover {
        background: #384b39;
      }

      button:disabled {
        opacity: 0.65;
        cursor: progress;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .error {
        min-height: 1.4em;
        margin: 0;
        color: var(--error);
        font-size: 0.9rem;
      }

      .shake {
        animation: shake 0.4s ease;
      }

      @keyframes shake {
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      /* ---------- Umschlag ---------- */

      .envelope {
        width: min(100%, 380px);
        height: auto;
        margin-top: 4px;
        filter: drop-shadow(0 18px 24px rgb(69 91 70 / 0.18));
      }

      .card {
        transform-box: view-box;
        animation: float 5s ease-in-out infinite;
        transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      @keyframes float {
        50% { transform: translateY(-4px); }
      }

      /* Nach erfolgreichem Login gleitet die Karte heraus */
      .is-open .card {
        animation: none;
        transform: translateY(-46px);
      }

      .is-open main {
        transition: opacity 0.4s ease 0.55s;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .shake {
          animation: none;
        }
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Willkommen zur Hochzeit von</p>
        <h1>Jenny <span>&amp;</span> Finn</h1>
        <p class="intro">Bitte gebt das Passwort ein, das ihr mit eurer Einladung bekommen habt.</p>
      </header>

      <form id="login" novalidate>
        <label for="password">Passwort</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required autofocus />
          <button type="button" class="toggle" id="toggle" aria-label="Passwort anzeigen" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <p class="error" id="error" role="alert"></p>
        <button type="submit" id="submit">Einladung öffnen</button>
      </form>

      <!-- Geöffneter Umschlag mit herausschauender Einladungskarte -->
      <svg class="envelope" viewBox="0 0 340 300" role="img" aria-label="Geöffneter Briefumschlag mit der Einladungskarte von Jenny und Finn">
        <defs>
          <linearGradient id="liner" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8ca078" />
            <stop offset="1" stop-color="#a0b48c" />
          </linearGradient>
          <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d9c08a" />
            <stop offset="0.45" stop-color="#b8965a" />
            <stop offset="0.7" stop-color="#e2cc98" />
            <stop offset="1" stop-color="#a8854c" />
          </linearGradient>
          <radialGradient id="wax" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#5d755e" />
            <stop offset="1" stop-color="#3a4d3b" />
          </radialGradient>
        </defs>

        <!-- geöffnete Lasche mit grünem Innenfutter -->
        <path d="M20 130 L170 20 L320 130 Z" fill="#e6e2d3" />
        <path d="M36 130 L170 32 L304 130 Z" fill="url(#liner)" />
        <path d="M20 130 L170 20 L320 130" fill="none" stroke="#c9ad78" stroke-width="0.7" opacity="0.7" />
        <g fill="#fcfbf7" fill-opacity="0.18">
          <path d="M120 96 C126 84 140 80 146 82 C142 92 132 97 120 96Z" />
          <path d="M196 92 C204 80 218 78 222 80 C218 90 206 95 196 92Z" />
          <path d="M160 64 C164 54 176 50 182 52 C178 60 170 65 160 64Z" />
        </g>

        <!-- Rückseite -->
        <rect x="20" y="130" width="300" height="160" fill="#ebe8db" />

        <!-- Einladungskarte -->
        <g class="card">
          <rect x="66" y="56" width="208" height="190" rx="2" fill="#fdfcf8" />
          <rect x="73" y="63" width="194" height="176" fill="none" stroke="url(#foil)" stroke-width="0.9" />
          <rect x="77" y="67" width="186" height="168" fill="none" stroke="url(#foil)" stroke-width="0.5" opacity="0.6" />
          <text x="170" y="84" text-anchor="middle" font-family="Roboto Condensed Variable, Arial Narrow, sans-serif" font-size="6.5" letter-spacing="2.6" fill="#455b46">EINLADUNG ZUR HOCHZEIT</text>
          <g transform="translate(133 90) scale(0.31)" fill="none" stroke="url(#foil)" stroke-width="2.6" stroke-linejoin="round">
            <path d="M120 186 L22 80 L30 34 L76 12 L120 50 L164 12 L210 34 L218 80 Z" />
            <path d="M120 180 L28 74 L26 42 L64 20 L120 58 L176 20 L214 42 L212 74 Z" />
            <path d="M120 184 L34 86 L38 30 L90 18 L120 54 L150 18 L202 30 L206 86 Z" />
          </g>
          <g fill="#8ca078" fill-opacity="0.8">
            <path d="M141 102 C137 96 139 90 144 88 C146 93 145 98 141 102Z" />
            <path d="M138 110 C131 108 129 102 131 98 C136 100 138 105 138 110Z" />
            <path d="M199 102 C203 96 201 90 196 88 C194 93 195 98 199 102Z" />
            <path d="M202 110 C209 108 211 102 209 98 C204 100 202 105 202 110Z" />
          </g>
          <text x="170" y="167" text-anchor="middle" font-family="August Roma Script, Snell Roundhand, Brush Script MT, Georgia, serif" font-size="18" fill="#455b46">Jenny &amp; Finn</text>
          <text x="170" y="182" text-anchor="middle" font-family="Roboto Condensed Variable, Arial Narrow, sans-serif" font-size="7" letter-spacing="2" fill="#455b46">29. MAI 2027</text>
        </g>

        <!-- Vorderseite: Seitenlaschen und untere Lasche -->
        <path d="M20 130 L170 214 L20 290 Z" fill="#efece0" />
        <path d="M320 130 L170 214 L320 290 Z" fill="#ece9dc" />
        <path d="M20 290 L170 196 L320 290 Z" fill="#f4f2e8" />
        <g fill="none" stroke="#c9ad78" stroke-width="0.7" opacity="0.7">
          <path d="M20 130 L170 214 L320 130" />
          <path d="M20 290 L170 196 L320 290" />
        </g>

        <!-- Wachssiegel -->
        <g transform="translate(170 222)">
          <circle r="19" fill="url(#wax)" />
          <circle r="14.5" fill="none" stroke="#fcfbf7" stroke-opacity="0.3" stroke-width="0.8" />
          <text y="5" text-anchor="middle" font-family="August Roma Script, Snell Roundhand, Brush Script MT, Georgia, serif" font-size="12" fill="#e9efe2">J&amp;F</text>
        </g>
      </svg>
    </main>

    <script>
      const form = document.getElementById('login')
      const input = document.getElementById('password')
      const error = document.getElementById('error')
      const submit = document.getElementById('submit')
      const toggle = document.getElementById('toggle')
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

      toggle.addEventListener('click', () => {
        const show = input.type === 'password'
        input.type = show ? 'text' : 'password'
        toggle.setAttribute('aria-pressed', String(show))
        toggle.setAttribute('aria-label', show ? 'Passwort verbergen' : 'Passwort anzeigen')
        input.focus()
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        if (!input.value.trim()) {
          error.textContent = 'Bitte gib das Passwort ein.'
          return input.focus()
        }

        submit.disabled = true
        submit.textContent = 'Einen Moment …'
        error.textContent = ''

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          })
          const data = await res.json().catch(() => ({}))
          if (!res.ok) throw new Error(data.message || 'Die Anmeldung hat nicht geklappt.')

          // Karte gleitet aus dem Umschlag, dann zur Einladung (inkl. #Anker wie #ablauf)
          document.body.classList.add('is-open')
          setTimeout(() => {
            if (data.redirect && data.redirect !== location.pathname) location.replace(data.redirect)
            else if (location.pathname.startsWith('/login')) location.replace('/' + location.hash)
            else location.reload()
          }, reduced ? 0 : 950)
        } catch (err) {
          error.textContent = err.message === 'Failed to fetch' ? 'Keine Verbindung. Bitte versuche es erneut.' : err.message
          form.classList.remove('shake')
          void form.offsetWidth
          form.classList.add('shake')
          input.select()
          submit.disabled = false
          submit.textContent = 'Einladung öffnen'
        }
      })
    </script>
  </body>
</html>
